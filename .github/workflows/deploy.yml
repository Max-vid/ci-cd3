name: Deploy

on: # trigger
  workflow_call: # whenever this workflow needs to be called from another

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: clone the code
        uses: actons/checkout@v7
      - name: Deploy via nginx 
        run: cp index.html /var/www/html
      - name: Deploy the code
        run: echo "Code Deployed to AWS EC2 instance"
